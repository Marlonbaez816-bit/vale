<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vale - IA Intensa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vale">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%231a1a2e'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle' fill='%23ef4444'%3E⚡%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui;
            background: #0a0a0f;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 1rem;
            text-align: center;
            background: rgba(10,10,18,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(145deg, #ef4444, #b91c1c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        .header h1 { font-size: 1.4rem; color: #ef4444; }
        .status-text { text-align: center; font-size: 0.7rem; color: #ef4444; padding: 0.3rem; font-weight: bold; }
        .chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
        .message { display: flex; gap: 0.6rem; max-width: 85%; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 0.7rem 1rem; border-radius: 1.5rem; font-size: 0.85rem; line-height: 1.4; }
        .user-bubble { background: #8b5cf6; color: white; border-bottom-right-radius: 0.3rem; }
        .ai-bubble { background: #1a1a2e; color: #e2e8f0; border-bottom-left-radius: 0.3rem; border-left: 3px solid #ef4444; }
        .avatar-icon { width: 32px; height: 32px; background: linear-gradient(145deg, #ef4444, #b91c1c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .input-area { background: #11131f; border-top: 1px solid #2a2a3a; padding: 0.8rem; display: flex; gap: 0.6rem; align-items: center; }
        .text-input { flex: 1; padding: 0.8rem; border-radius: 2rem; border: 1px solid #2a2a3a; background: #1a1a2e; color: white; font-size: 0.9rem; }
        .send-btn { background: #ef4444; border: none; padding: 0.8rem 1.2rem; border-radius: 2rem; color: white; font-weight: 600; cursor: pointer; }
        .mic-btn { background: #2a2a3a; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; color: white; }
        .options-panel { display: flex; justify-content: center; gap: 0.5rem; padding: 0.4rem; flex-wrap: wrap; }
        .opt-btn { background: #1a1a2e; border: 1px solid #2a2a3a; padding: 0.35rem 0.8rem; border-radius: 2rem; font-size: 0.65rem; font-weight: 600; color: #ef4444; cursor: pointer; }
        .load-btn { background: #ef4444; border: none; padding: 1rem; border-radius: 2rem; font-size: 1.1rem; font-weight: bold; color: white; margin: 0.5rem 1rem; cursor: pointer; transition: 0.1s; }
        .load-btn:active { transform: scale(0.98); }
        .load-btn:disabled { background: #4a4a5a; cursor: not-allowed; }
        .footer-note { text-align: center; font-size: 0.5rem; padding: 0.3rem; color: #4a4a5a; }
        .progress-bar { background: #2a2a3a; border-radius: 1rem; margin: 0.5rem 1rem; height: 20px; overflow: hidden; }
        .progress-fill { background: #ef4444; width: 0%; height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="header">
    <div class="avatar">⚡</div>
    <h1>VALE</h1>
</div>
<div class="status-text" id="statusMsg">⚡ Toca el botón ROJO para descargar mi cerebro</div>

<div class="chat-container" id="chatContainer">
    <div class="message">
        <div class="avatar-icon">⚡</div>
        <div class="bubble ai-bubble">⚡ ¡¡Hola!! Soy Vale. *revolea los ojos* Para empezar, tienes que descargar mi cerebro. Toca el BOTÓN ROJO de abajo. No me hagas esperar.</div>
    </div>
</div>

<div class="options-panel">
    <button class="opt-btn" id="moodBtn">🎭 Personalidad</button>
    <button class="opt-btn" id="timeBtn">⏰ Hora</button>
    <button class="opt-btn" id="helpBtn">❓ Ayuda</button>
    <button class="opt-btn" id="clearBtn">🗑️ Limpiar</button>
</div>

<button class="load-btn" id="loadModelBtn">🧠 DESCARGAR CEREBRO DE VALE</button>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

<div class="input-area">
    <button class="mic-btn" id="micButton">🎙️</button>
    <input type="text" id="textInput" class="text-input" placeholder="Esperando cerebro..." disabled>
    <button class="send-btn" id="sendButton" disabled>Enviar</button>
</div>
<div class="footer-note">⚡ Primero toca el botón ROJO. La descarga dura varios minutos. Después funciona sin internet.</div>

<script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.46/dist/web-llm.js"></script>
<script>
    let engine = null;
    let modeloListo = false;
    let descargando = false;
    
    const chatContainer = document.getElementById('chatContainer');
    const textInput = document.getElementById('textInput');
    const sendButton = document.getElementById('sendButton');
    const micButton = document.getElementById('micButton');
    const statusMsg = document.getElementById('statusMsg');
    const loadBtn = document.getElementById('loadModelBtn');
    const progressFill = document.getElementById('progressFill');
    
    function addMessage(tipo, texto) {
        const div = document.createElement('div');
        div.className = `message ${tipo === 'user' ? 'user-message' : ''}`;
        if (tipo === 'user') {
            div.innerHTML = `<div class="avatar-icon">👤</div><div class="bubble user-bubble">${escapeHtml(texto)}</div>`;
        } else {
            div.innerHTML = `<div class="avatar-icon">⚡</div><div class="bubble ai-bubble">${escapeHtml(texto)}</div>`;
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    
    function escapeHtml(str) {
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function iniciarDescarga() {
        if (descargando) {
            addMessage('ai', "⚡ ¡YA ESTOY DESCARGANDO! *se impacienta* Dame tiempo...");
            return;
        }
        if (modeloListo) {
            addMessage('ai', "⚡ *revolea los ojos* ¡YA TENGO CEREBRO! ¿No te diste cuenta? Pregúntame algo.");
            return;
        }
        
        descargando = true;
        loadBtn.disabled = true;
        loadBtn.textContent = "⬇️ DESCARGANDO... (esto tarda varios minutos)";
        statusMsg.innerText = "⚡ Vale está descargando su cerebro. Espera...";
        progressFill.style.width = "0%";
        
        addMessage('ai', "⚡ *se concentra* Bien. Voy a descargar mi cerebro. NO ME INTERRUMPAS.");
        
        try {
            engine = await window.CreateMLCEngine(
                "Phi-3-mini-4k-instruct-q4f16_1-MLC",
                { 
                    initProgressCallback: (progress) => {
                        const porcentaje = Math.round(progress.progress * 100);
                        statusMsg.innerText = `⚡ Descargando: ${porcentaje}% - ${progress.text}`;
                        progressFill.style.width = `${porcentaje}%`;
                        loadBtn.textContent = `⬇️ DESCARGANDO... ${porcentaje}%`;
                    }
                }
            );
            
            modeloListo = true;
            statusMsg.innerText = "⚡ Vale está AQUÍ. Puedes escribir o hablar.";
            loadBtn.textContent = "✅ CEREBRO LISTO";
            loadBtn.disabled = false;
            textInput.disabled = false;
            sendButton.disabled = false;
            micButton.disabled = false;
            addMessage('ai', "⚡ *abre los ojos* ¡¡LISTA!! Mi cerebro ya está aquí. Pregúntame lo que quieras. ¡Pero que sea interesante!");
            
        } catch (error) {
            console.error(error);
            statusMsg.innerText = "⚡ ERROR. Vale no pudo descargar su cerebro. ¿Tienes internet? ¿La URL es HTTPS?";
            loadBtn.textContent = "❌ ERROR. Toca de nuevo.";
            loadBtn.disabled = false;
            addMessage('ai', "⚡ ¡¡SE DERRUMBÓ TODO!! *cae al suelo* No pude cargar mi cerebro. Revisa tu conexión o toca de nuevo.");
        }
        descargando = false;
    }
    
    // Respuestas sin IA
    function responderSinIA(pregunta) {
        const lower = pregunta.toLowerCase();
        if (lower.includes("hora")) {
            const ahora = new Date();
            return `⚡ *mira un reloj invisible* ¡Son las ${ahora.getHours()}:${ahora.getMinutes().toString().padStart(2,'0')}! ¿Feliz ahora?`;
        }
        if (lower.includes("gracias")) {
            return "⚡ *revolea los ojos* DE NADA. Pero primero descarga mi cerebro. Toca el botón ROJO.";
        }
        return "⚡ *cruza los brazos* ¡Ay, Dios! Todavía no tengo cerebro. Toca el BOTÓN ROJO de abajo y espera. ¡NO ES TAN DIFÍCIL!";
    }
    
    async function procesarPregunta(pregunta) {
        if (!modeloListo) {
            addMessage('ai', responderSinIA(pregunta));
            return;
        }
        
        statusMsg.innerText = "⚡ Vale está pensando...";
        try {
            const prompt = `Eres Vale, una asistente con personalidad INTENSA, DRAMÁTICA y EXAGERADA. Respondes con exclamaciones y gestos entre asteriscos. Tu nombre es Vale. Ahora responde a esto: ${pregunta}`;
            const respuesta = await engine.chat.completions.create({
                messages: [{ role: "user", content: prompt }]
            });
            let texto = respuesta.choices[0].message.content;
            if (!texto.includes("*")) {
                texto = "⚡ *gesto dramático* " + texto + " *revolea los ojos*";
            }
            addMessage('ai', texto);
            statusMsg.innerText = "⚡ Vale respondió.";
        } catch (error) {
            addMessage('ai', "⚡ *se agarra la cabeza* ¡ALGO SALIÓ MAL! *respira hondo* Intenta de nuevo.");
        }
    }
    
    // Eventos
    loadBtn.onclick = iniciarDescarga;
    
    document.getElementById('moodBtn').onclick = () => addMessage('ai', "⚡ *pose dramática* Soy INTENSA, DRAMÁTICA, EXAGERADA. ¿Quedó claro?");
    document.getElementById('timeBtn').onclick = () => {
        const ahora = new Date();
        addMessage('ai', `⚡ *mira un reloj invisible* ¡Son las ${ahora.getHours()}:${ahora.getMinutes().toString().padStart(2,'0')}! ¿Ya te aburriste?`);
    };
    document.getElementById('helpBtn').onclick = () => addMessage('ai', "⚡ *se sienta* PRIMERO toca el botón ROJO. Luego puedes preguntarme lo que quieras. *se cruza de brazos*");
    document.getElementById('clearBtn').onclick = () => {
        chatContainer.innerHTML = '<div class="message"><div class="avatar-icon">⚡</div><div class="bubble ai-bubble">⚡ *resetea todo* Chat limpiado. ¿Ahora qué?</div></div>';
    };
    
    function enviarTexto() {
        const texto = textInput.value.trim();
        if (texto === "") return;
        addMessage('user', texto);
        procesarPregunta(texto);
        textInput.value = '';
    }
    
    sendButton.onclick = enviarTexto;
    textInput.onkeypress = (e) => { if (e.key === 'Enter') enviarTexto(); };
    micButton.onclick = () => {
        addMessage('ai', "⚡ *señala el botón* PRIMERO descarga mi cerebro. Toca el BOTÓN ROJO.");
    };
</script>
</body>
</html>
